name: CI

on: [push]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=junit.xml

      - name: Send report to local receiver
        if: always()
        run: python ci/send_report.py
        env:
          RECEIVER_URL: http://localhost:8000/report
          