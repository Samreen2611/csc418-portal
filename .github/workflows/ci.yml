name: CI

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=junit.xml

      - name: Send report to local receiver
        if: always()
        run: python ci/send_report.py
        env:
          RECEIVER_URL: http://localhost:8000/report

      # Bonus: email report (pass aur fail dono me)
      - name: Email test report
        if: always()
        continue-on-error: true
        run: python ci/send_email.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}